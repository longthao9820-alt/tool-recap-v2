[project]
name = "toolrecap-v2"
version = "0.1.0"
description = "Automated English Recap Video Desktop Application"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "piper-tts>=1.2.0",
    "onnxruntime>=1.16.0",
    "soundfile>=0.12.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=C:/Users/Long/AppData/Local/Temp/kilo/pytest_v2"
